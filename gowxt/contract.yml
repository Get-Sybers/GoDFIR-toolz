# gowxt/contract.yml — the single source of truth for how DX_DFIR drives this tool.
tool: gowxt
image: get-sybers/gowxt:latest
entrypoint: self-orchestrating
description: >
  Windows Timeline (ActivitiesCache.db) parser (static Go on modernc.org/sqlite,
  no cgo). Batches over the mounted evidence tree, finds every SQLite database
  that carries an Activity table, copies it (with any -wal/-shm sidecar) into
  the work dir to open it, and writes one record per Activity row into one
  output folder per database.

env:
  GOWXT_INPUT_DIR: {required: false, default: /input,  desc: 'evidence tree, recursed read-only; every SQLite file with an Activity table is an item, whatever its name'}
  GOWXT_OUT_DIR:   {required: false, default: /output, desc: 'output root, one folder per database'}
  GOWXT_WORK_DIR:  {required: false, default: /work,   desc: 'scratch (writable tmpfs) holding the SQLite working copy; unusable = the database is opened read-only immutable and an un-checkpointed -wal is not seen'}
  GOWXT_FORCE:     {required: false, default: "0", type: bool, desc: '1/true/yes/on reruns items that already have valid output'}
  GOWXT_FORMAT:    {required: false, default: json,    desc: 'record format, json (JSONL) or csv'}
  GOWXT_LOG_LEVEL: {required: false, default: info,    desc: 'error|warn|info|debug, stderr only'}

mounts:
  - {name: input,  path: /input,  mode: ro, env: GOWXT_INPUT_DIR, required: true}
  - {name: output, path: /output, mode: rw, env: GOWXT_OUT_DIR,   required: true}
  - {name: work,   path: /work,   mode: rw, env: GOWXT_WORK_DIR,  required: false}

network: none
exit_codes: {0: success, 1: nothing_produced, 2: config_error, 3: partial}

summary_schema:
  required: [tool, version, status, inputs, processed, skipped, failed, records, outputs, exit, started, duration_s]

outputs:
  layout: "<OUT_DIR>/<item>/gowxt.jsonl (or gowxt.csv) — one record per Activity row (SourceFile, Id, Executable, DisplayText, ContentInfo, ActivityType, StartTime, EndTime, Duration, LastModifiedTime, ExpirationTime, …); <item> is the database path relative to INPUT_DIR with path separators and whitespace folded to _"

argv_passthrough: >
  Debug only, never used by DX_DFIR: -f DB | -d DIR, --json DIR --jsonf NAME |
  --csv DIR --csvf NAME, --work-dir DIR, -q. Exit 0 ok / 1 usage or fatal /
  2 at least one database failed.
