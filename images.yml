# The canonical get-sybers/* image inventory — the one source of truth for
# every consumer. Schema and consumers: README.md "The image inventory".
namespace: get-sybers

images:
  # ---- pipeline images (repo-root context)
  - name: signatures
    aliases: [yara, suricata, hayabusa]
  - name: byakugan
    engine_ref: BYAKUGAN_REF
    env_args: [BYAKUGAN_REF]
    aliases: [mitrecar, car]
  - name: zeek
  - name: anamnesis
    engine_ref: ANAMNESIS_REF
    env_args: [ANAMNESIS_REF, MEMPROCFS_VERSION, MEMPROCFS_SHA256]
    aliases: [memory]
  - name: plaso
    aliases: [log2timeline, psort]

  # ---- the Windows Go parsers (each FROM scratch, its own subdir the context)
  - name: goprefetch
    context: goprefetch
    dockerfile: Dockerfile
    aliases: [prefetch, pecmd]
  - name: goese
    context: goese
    dockerfile: Dockerfile
    aliases: [esedump, srum, srumecmd, sumecmd]
  - name: gorb
    context: gorb
    dockerfile: Dockerfile
    aliases: [rbcmd]
  - name: gomft
    context: gomft
    dockerfile: Dockerfile
    aliases: [mftecmd]
  - name: goevtx
    context: goevtx
    dockerfile: Dockerfile
    aliases: [evtxecmd]
  - name: goamcache
    context: goamcache
    dockerfile: Dockerfile
    aliases: [amcacheparser]
  - name: goappcompat
    context: goappcompat
    dockerfile: Dockerfile
    aliases: [appcompatcacheparser]
  - name: gore
    context: gore
    dockerfile: Dockerfile
    aliases: [recmd]
  - name: gosbe
    context: gosbe
    dockerfile: Dockerfile
    aliases: [sbecmd]
  - name: gole
    context: gole
    dockerfile: Dockerfile
    aliases: [lecmd]
  - name: gojle
    context: gojle
    dockerfile: Dockerfile
    aliases: [jlecmd]
  - name: gowxt
    context: gowxt
    dockerfile: Dockerfile
    aliases: [wxtcmd]

  # ---- the Linux matrix (repo-root context: godaemonhunter copies the sibling pinfo/)
  - name: godaemonhunter
    aliases: [daemonhunter, hunt]
    subtool_aliases: [gowtmp, gojournal, goauditd, gosyslog, goshell, gousers,
                      gocron, gounit, gotrash, gohost, gonetwork, goctl]
  - name: gomount
    context: gomount
    dockerfile: Dockerfile

  # ---- the .NET tools (GODFIR_TOOL casing = the published zip basename)
  - name: sqlecmd
    dockerfile: godfir-tool/Dockerfile
    args: {GODFIR_TOOL: SQLECmd}
  - name: bstrings
    dockerfile: godfir-tool/Dockerfile
    args: {GODFIR_TOOL: bstrings}
  - name: iisgeolocate
    dockerfile: godfir-tool/Dockerfile
    args: {GODFIR_TOOL: iisGeolocate}
  - name: recentfilecacheparser
    dockerfile: godfir-tool/Dockerfile
    args: {GODFIR_TOOL: RecentFileCacheParser}
  - name: rla
    dockerfile: godfir-tool/Dockerfile
    args: {GODFIR_TOOL: rla}

unbuildable:
  vscmount: >-
    VSCMount manipulates the Windows VSS device namespace and has no Linux
    container; use libvshadow (vshadowinfo/vshadowmount) on the host.

non_tool_repos:
  - get-sybers/molecule
