# gohost/contract.yml — the single source of truth for how DX_DFIR drives this tool.
tool: gohost
image: get-sybers/gohost:latest
entrypoint: self-orchestrating
description: >
  Host identity and storage-mapping parser (static Go on the shared pinfo
  module): os-release, hostname, machine-id, timezone/localtime and locale
  anchor whose evidence this is; fstab and crypttab rows tie durable volume
  identities (UUID/LABEL) to mount points and mapper names — the role a
  drive serial plays on Windows. Extraction only: applying the timezone or
  joining UUIDs to volumes is byakugan's.

env:
  GOHOST_INPUT_DIR: {required: false, default: /input,  desc: 'evidence tree, recursed read-only; every recognised host-config file is an item'}
  GOHOST_OUT_DIR:   {required: false, default: /output, desc: 'output root, one folder per input file'}
  GOHOST_WORK_DIR:  {required: false, default: /work,   desc: 'scratch (writable tmpfs); gohost needs none but honours it'}
  GOHOST_FORCE:     {required: false, default: "0", type: bool, desc: '1/true/yes/on reruns items that already have valid output'}
  GOHOST_LOG_LEVEL: {required: false, default: info,    desc: 'error|warn|info|debug, stderr only'}

mounts:
  - {name: input,  path: /input,  mode: ro, env: GOHOST_INPUT_DIR, required: true}
  - {name: output, path: /output, mode: rw, env: GOHOST_OUT_DIR,   required: true}
  - {name: work,   path: /work,   mode: rw, env: GOHOST_WORK_DIR,  required: false}

network: none
exit_codes: {0: success, 1: nothing_produced, 2: config_error, 3: partial}

summary_schema:
  required: [tool, version, pinfo, status, inputs, processed, skipped, failed, records, outputs, exit, started, duration_s]

outputs:
  layout: "<OUT_DIR>/<item>/gohost.jsonl; <item> is the file path relative to INPUT_DIR with path separators and whitespace folded to _"

records:
  envelope: [Tool, ToolVersion, RecordType, SourceFilename, SourceModified, EventTime, TimeKind, Origin, Snapshot, Residue]
  os_release: {Name: 'NAME', ID: 'ID', VersionID: 'VERSION_ID', PrettyName: 'PRETTY_NAME', Fields: 'every other KEY=value verbatim'}
  hostname: {Hostname: 'the etc/hostname value'}
  machine_id: {MachineID: 'the 32-hex machine id (joins gojournal MachineID)'}
  timezone: {Timezone: 'the etc/timezone zone name (Debian-style)', PosixTZ: 'the TZif v2+ trailing POSIX rule from a staged etc/localtime (the symlink target name is lost in staging)'}
  locale: {Lang: 'LANG', Fields: 'every other KEY=value verbatim'}
  fstab_entry: {Device: 'the spec column verbatim', SpecType: 'uuid | label | partuuid | partlabel | path | remote | other', UUID: 'the UUID when the spec carries one — joins Origin.FSUUID', Label: 'the LABEL when the spec carries one', MountPoint: 'where it mounts', FSType: 'filesystem type', Options: 'options verbatim', Dump: 'dump field', Pass: 'fsck pass', Line: 'source line number', Raw: 'the whole line when unparsed'}
  crypttab_entry: {MapperName: 'the mapped device name', Device: 'the backing device spec verbatim', SpecType: 'as fstab_entry', UUID: 'as fstab_entry', KeyFile: 'the key source unless none/-', Options: 'options verbatim', Line: 'source line number', Raw: 'the whole line when unparsed'}

argv_passthrough: >
  Debug only, never used by DX_DFIR: -f FILE | -d DIR, -q. Records stream
  to stdout. Exit 0 ok / 1 usage or fatal / 2 at least one file failed.
