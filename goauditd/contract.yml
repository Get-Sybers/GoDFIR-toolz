# goauditd/contract.yml — the single source of truth for how DX_DFIR drives this tool.
tool: goauditd
image: get-sybers/goauditd:latest
entrypoint: self-orchestrating
description: >
  Linux audit log parser (static Go on the shared pinfo module): audit.log
  records (rotations and gzip included) coalesced into one record per event
  by their audit(sec.msec:serial) id — SYSCALL/EXECVE/CWD/PATH/PROCTITLE
  and the USER_* families — hex-encoded fields decoded, execve argv
  reassembled in order, everything else kept native.

env:
  GOAUDITD_INPUT_DIR: {required: false, default: /input,  desc: 'evidence tree, recursed read-only; every audit.log (rotations, .gz) is an item'}
  GOAUDITD_OUT_DIR:   {required: false, default: /output, desc: 'output root, one folder per audit log'}
  GOAUDITD_WORK_DIR:  {required: false, default: /work,   desc: 'scratch (writable tmpfs); goauditd needs none but honours it'}
  GOAUDITD_FORCE:     {required: false, default: "0", type: bool, desc: '1/true/yes/on reruns items that already have valid output'}
  GOAUDITD_FORMAT:    {required: false, default: json,    desc: 'record format, json (JSONL) or csv'}
  GOAUDITD_LOG_LEVEL: {required: false, default: info,    desc: 'error|warn|info|debug, stderr only'}

mounts:
  - {name: input,  path: /input,  mode: ro, env: GOAUDITD_INPUT_DIR, required: true}
  - {name: output, path: /output, mode: rw, env: GOAUDITD_OUT_DIR,   required: true}
  - {name: work,   path: /work,   mode: rw, env: GOAUDITD_WORK_DIR,  required: false}

network: none
exit_codes: {0: success, 1: nothing_produced, 2: config_error, 3: partial}

summary_schema:
  required: [tool, version, pinfo, status, inputs, processed, skipped, failed, records, outputs, exit, started, duration_s]

outputs:
  layout: "<OUT_DIR>/<item>/goauditd.jsonl (or goauditd.csv); <item> is the file path relative to INPUT_DIR with path separators and whitespace folded to _"

records:
  envelope: [Tool, ToolVersion, RecordType, SourceFilename, SourceModified, EventTime, TimeKind, Origin, Snapshot, Residue]
  auditd_event:
    AuditID: 'the audit(sec.msec:serial) id — the record identity, carried never minted'
    Types: 'the record types coalesced into this event, in order'
    Syscall: 'syscall number verbatim'
    SyscallName: 'rendered name for the x86_64 table; empty otherwise'
    Arch: 'audit arch value verbatim'
    Success: 'yes/no verbatim'
    Exit: 'exit value verbatim'
    PID: 'process id (numeric string, native)'
    PPID: 'parent pid'
    UID: 'uid, numeric verbatim (resolution is enrichment, byakugan''s)'
    AUID: 'audit (login) uid, numeric verbatim'
    EUID: 'effective uid'
    GID: 'gid'
    SES: 'audit session id'
    TTY: 'tty'
    Comm: 'comm, hex-decoded when encoded'
    Exe: 'executable path'
    Key: 'the audit rule key (dropped when (null))'
    Argv: 'execve argv in order, hex args decoded'
    Cwd: 'the CWD record path'
    Paths: 'the PATH records: Name/Nametype/Inode/Mode each'
    Proctitle: 'PROCTITLE decoded, NULs to spaces'
    Fields: 'every other key=value of the event, first occurrence wins'

argv_passthrough: >
  Debug only, never used by DX_DFIR: -f FILE | -d DIR, --format json|csv, -q.
  Records stream to stdout. Exit 0 ok / 1 usage or fatal / 2 at least one
  file failed.
