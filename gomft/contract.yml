# gomft/contract.yml — the single source of truth for how DX_DFIR drives this tool.
tool: gomft
image: get-sybers/gomft:latest
entrypoint: self-orchestrating
description: >
  Raw NTFS $MFT parser (static Go on Velociraptor's go-ntfs). Batches over the
  mounted evidence tree, content-detects every $MFT by its FILE record
  signature (a raw-mount $MFT and Plaso's renamed _MFT both match), and writes
  one record per MFT entry into one output folder per table.

env:
  GOMFT_INPUT_DIR: {required: false, default: /input,  desc: evidence tree, recursed read-only; every file carrying the FILE signature is an item}
  GOMFT_OUT_DIR:   {required: false, default: /output, desc: output root, one folder per item}
  GOMFT_WORK_DIR:  {required: false, default: /work,   desc: scratch (writable tmpfs); gomft needs none but honours it}
  GOMFT_FORCE:     {required: false, default: "0", type: bool, desc: 1/true/yes/on reruns items that already have valid output}
  GOMFT_FORMAT:    {required: false, default: json,    desc: record format, json (JSONL) or csv}
  GOMFT_LOG_LEVEL: {required: false, default: info,    desc: error|warn|info|debug, stderr only}

mounts:
  - {name: input,  path: /input,  mode: ro, env: GOMFT_INPUT_DIR, required: true}
  - {name: output, path: /output, mode: rw, env: GOMFT_OUT_DIR,   required: true}
  - {name: work,   path: /work,   mode: rw, env: GOMFT_WORK_DIR,  required: false}

network: none
exit_codes: {0: success, 1: nothing_produced, 2: config_error, 3: partial}

summary_schema:
  required: [tool, version, status, inputs, processed, skipped, failed, records, outputs, exit, started, duration_s]

outputs:
  layout: "<OUT_DIR>/<item>/gomft.jsonl (or gomft.csv) — one record per MFT entry; <item> is the input path relative to INPUT_DIR with path separators and whitespace folded to _"

argv_passthrough: >
  Debug only, never used by DX_DFIR: -f FILE | -d DIR | --tar (tar on stdin),
  --json DIR --jsonf NAME | --csv DIR --csvf NAME, --record-size N,
  --cluster-size N, -q. Exit 0 ok / 1 usage or fatal / 2 at least one file failed.
