# goese/contract.yml — the single source of truth for how DX_DFIR drives this tool.
tool: goese
image: get-sybers/goese:latest
entrypoint: self-orchestrating
description: >
  ESE database dumper for SRUM and SUM (static Go on Velociraptor's go-ese).
  Batches over the mounted evidence tree, finds every SRUM database (SRUDB.dat)
  and SUM database (*.mdb directly under a SUM/ directory), and dumps every
  table of each into one output folder per database, with SruDbIdMapTable
  enrichment (AppIdName / UserIdName) on SRUM rows.

env:
  GOESE_INPUT_DIR: {required: false, default: /input,  desc: evidence tree, recursed read-only; every SRUDB.dat and every *.mdb under a SUM/ directory (case-insensitive) is an item}
  GOESE_OUT_DIR:   {required: false, default: /output, desc: output root, one folder per database}
  GOESE_WORK_DIR:  {required: false, default: /work,   desc: scratch (writable tmpfs); goese needs none but honours it}
  GOESE_FORCE:     {required: false, default: "0", type: bool, desc: 1/true/yes/on reruns items that already have valid output}
  GOESE_FORMAT:    {required: false, default: json,    desc: record format, json (JSONL) or csv, for the per-table files and the index}
  GOESE_TABLES:    {required: false, default: "",      desc: comma-separated tables to dump (name, SRUM alias or GUID); empty = every non-MSys table; a table absent from a database is noted and skipped}
  GOESE_LOG_LEVEL: {required: false, default: info,    desc: error|warn|info|debug, stderr only}

mounts:
  - {name: input,  path: /input,  mode: ro, env: GOESE_INPUT_DIR, required: true}
  - {name: output, path: /output, mode: rw, env: GOESE_OUT_DIR,   required: true}
  - {name: work,   path: /work,   mode: rw, env: GOESE_WORK_DIR,  required: false}

network: none
exit_codes: {0: success, 1: nothing_produced, 2: config_error, 3: partial}

summary_schema:
  required: [tool, version, status, inputs, processed, skipped, failed, records, outputs, exit, started, duration_s]

outputs:
  layout: "<OUT_DIR>/<item>/<table>.jsonl (or .csv) — one file per dumped table, well-known SRUM provider GUIDs under their friendly names — plus <OUT_DIR>/<item>/goese.jsonl (or goese.csv), the per-table index (table, alias, file, rows) that marks the item done; <item> is the database path relative to INPUT_DIR with path separators and whitespace folded to _"

argv_passthrough: >
  Debug only, never used by DX_DFIR: -f DB | -d ROOT, -t TABLES, --list,
  --json DIR | --csv DIR, -q. Exit 0 ok / 1 usage or fatal / 2 at least one
  table or database failed.
