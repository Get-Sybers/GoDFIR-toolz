# The artefact-set catalogue for `gomount materialise` — format and matching
# rules: README.md (a data file, read via go:embed; never edit Go to add an artefact).
sets:
  registry-core:
    primaries:
      - '\Windows\System32\config\SYSTEM'
      - '\Windows\System32\config\SOFTWARE'
      - '\Windows\System32\config\SAM'
      - '\Windows\System32\config\SECURITY'
    siblings: ['.LOG1', '.LOG2']

  amcache:
    primaries:
      - '\Windows\AppCompat\Programs\Amcache.hve'
    siblings: ['.LOG1', '.LOG2']

  shimcache:
    primaries:
      - '\Windows\System32\config\SYSTEM'
    siblings: ['.LOG1', '.LOG2']

  ntuser:
    primaries:
      - '\Users\*\NTUSER.DAT'
    siblings: ['.LOG1', '.LOG2']

  usrclass:
    primaries:
      - '\Users\*\AppData\Local\Microsoft\Windows\UsrClass.dat'
    siblings: ['.LOG1', '.LOG2']

  srum:
    primaries:
      - '\Windows\System32\sru\SRUDB.dat'
    siblings: []

  # the SUM/ parent stays in the output: goese treats *.mdb as SUM only under a literal SUM directory
  sum:
    primaries:
      - '\Windows\System32\LogFiles\SUM\*.mdb'
    siblings: []

  timeline:
    primaries:
      - '\Users\*\AppData\Local\ConnectedDevicesPlatform\*\ActivitiesCache.db'
    siblings: ['-wal', '-shm']

  # docs/linux §5.4: the root-filesystem surface the daemon parsers consume
  linux-core:
    primaries:
      - 'var/log/**'
      - 'etc/passwd'
      - 'etc/shadow'
      - 'etc/group'
      - 'etc/gshadow'
      - 'etc/sudoers'
      - 'etc/sudoers.d/**'
      - 'etc/crontab'
      - 'etc/cron.d/**'
      - 'etc/cron.daily/**'
      - 'etc/cron.hourly/**'
      - 'etc/cron.weekly/**'
      - 'etc/cron.monthly/**'
      - 'etc/anacrontab'
      - 'etc/ssh/**'
      - 'etc/systemd/**'
      - 'etc/os-release'
      - 'etc/hostname'
      - 'etc/hosts'
      - 'etc/fstab'
      - 'etc/crypttab'
      - 'etc/machine-id'
      - 'etc/timezone'
      - 'etc/localtime'
      - 'etc/adjtime'
      - 'etc/nsswitch.conf'
      - 'etc/resolv.conf'
      - 'etc/hosts.allow'
      - 'etc/hosts.deny'
      - 'etc/ld.so.preload'
      - 'etc/ld.so.conf'
      - 'etc/ld.so.conf.d/**'
      - 'etc/sysctl.conf'
      - 'etc/sysctl.d/**'
      - 'etc/modprobe.d/**'
      - 'etc/modules-load.d/**'
      - 'etc/NetworkManager/system-connections/**'
      - 'etc/netplan/**'
      - 'etc/network/interfaces'
      - 'var/spool/cron/**'
      - 'var/spool/at/**'
      - 'usr/lib/systemd/system/**'
      - 'lib/systemd/system/**'
      - 'run/systemd/system/**'
      - 'lost+found/**'
      - 'var/lib/dpkg/status'
      - 'var/lib/rpm/**'
      - 'var/lib/pacman/local/**'
      - 'var/lib/snapd/state.json'
      - 'home/*/.bash_history'
      - 'home/*/.zsh_history'
      - 'home/*/.local/share/fish/fish_history'
      - 'home/*/.python_history'
      - 'home/*/.mysql_history'
      - 'home/*/.psql_history'
      - 'home/*/.ssh/**'
      - 'home/*/.config/systemd/user/**'
      - 'home/*/.local/share/Trash/**'
      - 'root/.bash_history'
      - 'root/.zsh_history'
      - 'root/.ssh/**'
      - 'root/.config/systemd/user/**'
      - 'root/.local/share/Trash/**'
    siblings: ['-wal', '-shm']
