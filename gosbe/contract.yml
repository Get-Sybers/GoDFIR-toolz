# gosbe/contract.yml — the single source of truth for how DX_DFIR drives this tool.
tool: gosbe
image: get-sybers/gosbe:latest
entrypoint: self-orchestrating
description: >
  Windows ShellBags (BagMRU) parser (static Go on Velociraptor's regparser).
  Batches over the mounted evidence tree, finds every NTUSER.DAT and
  UsrClass.dat hive by name and regf signature, replays sibling .LOG1/.LOG2
  transaction logs, walks every BagMRU root, and writes one record per
  shellbag with its reconstructed AbsolutePath into one output folder per hive.

env:
  GOSBE_INPUT_DIR: {required: false, default: /input,  desc: 'evidence tree, recursed read-only; every regf hive named NTUSER.DAT or UsrClass.dat (case-insensitive) is an item'}
  GOSBE_OUT_DIR:   {required: false, default: /output, desc: 'output root, one folder per hive'}
  GOSBE_WORK_DIR:  {required: false, default: /work,   desc: 'scratch (writable tmpfs) for the recovered copy during .LOG replay; unusable = replay falls back to the committed hive'}
  GOSBE_FORCE:     {required: false, default: "0", type: bool, desc: '1/true/yes/on reruns items that already have valid output'}
  GOSBE_FORMAT:    {required: false, default: json,    desc: 'record format; json (JSONL) is the only format'}
  GOSBE_REPLAY:    {required: false, default: "1", type: bool, desc: 'replay dirty-hive .LOG1/.LOG2 transaction logs found beside a hive'}
  GOSBE_LOG_LEVEL: {required: false, default: info,    desc: 'error|warn|info|debug, stderr only'}

mounts:
  - {name: input,  path: /input,  mode: ro, env: GOSBE_INPUT_DIR, required: true}
  - {name: output, path: /output, mode: rw, env: GOSBE_OUT_DIR,   required: true}
  - {name: work,   path: /work,   mode: rw, env: GOSBE_WORK_DIR,  required: false}

network: none
exit_codes: {0: success, 1: nothing_produced, 2: config_error, 3: partial}

summary_schema:
  required: [tool, version, status, inputs, processed, skipped, failed, records, outputs, exit, started, duration_s]

outputs:
  layout: "<OUT_DIR>/<item>/gosbe.jsonl — one record per shellbag (HivePath, BagPath, Slot, NodeSlot, MRUPosition, ShellType, Value, AbsolutePath, LastWriteTime); <item> is the hive path relative to INPUT_DIR with path separators and whitespace folded to _"

argv_passthrough: >
  Debug only, never used by DX_DFIR: -f HIVE | -d DIR, --json DIR --jsonf NAME,
  --work-dir DIR, --nl, -q. Exit 0 ok / 1 usage or fatal / 2 at least one hive
  failed.
