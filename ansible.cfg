# read from the repo root (build-all.sh cd's here), so the role resolves uninstalled
[defaults]
roles_path = roles
# build-all.sh's in-tree install of the pinned community.docker FIRST (a bare
# standalone clone), the user/system paths after (a host that already has it)
collections_path = .ansible/collections:~/.ansible/collections:/usr/share/ansible/collections
