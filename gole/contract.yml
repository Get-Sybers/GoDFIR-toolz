# gole/contract.yml — the single source of truth for how DX_DFIR drives this tool.
tool: gole
image: get-sybers/gole:latest
entrypoint: self-orchestrating
description: >
  Windows shell link (.lnk) parser (static Go on parsiya/golnk). Batches over
  the mounted evidence tree, finds every shortcut by its .lnk extension or its
  0x4C ShellLinkHeader, and writes one record per shortcut into one output
  folder per file.

env:
  GOLE_INPUT_DIR: {required: false, default: /input,  desc: 'evidence tree, recursed read-only; every file with the .lnk extension or the 0x4C shell-link header is an item'}
  GOLE_OUT_DIR:   {required: false, default: /output, desc: 'output root, one folder per shortcut'}
  GOLE_WORK_DIR:  {required: false, default: /work,   desc: 'scratch (writable tmpfs); gole needs none but honours it'}
  GOLE_FORCE:     {required: false, default: "0", type: bool, desc: '1/true/yes/on reruns items that already have valid output'}
  GOLE_FORMAT:    {required: false, default: json,    desc: 'record format, json (JSONL) or csv'}
  GOLE_LOG_LEVEL: {required: false, default: info,    desc: 'error|warn|info|debug, stderr only'}

mounts:
  - {name: input,  path: /input,  mode: ro, env: GOLE_INPUT_DIR, required: true}
  - {name: output, path: /output, mode: rw, env: GOLE_OUT_DIR,   required: true}
  - {name: work,   path: /work,   mode: rw, env: GOLE_WORK_DIR,  required: false}

network: none
exit_codes: {0: success, 1: nothing_produced, 2: config_error, 3: partial}

summary_schema:
  required: [tool, version, status, inputs, processed, skipped, failed, records, outputs, exit, started, duration_s]

outputs:
  layout: "<OUT_DIR>/<item>/gole.jsonl (or gole.csv) — one record per shortcut (SourceFile, Source*/Target* timestamps, FileSize, LocalPath, RelativePath, WorkingDirectory, Arguments, flags); <item> is the file path relative to INPUT_DIR with path separators and whitespace folded to _"

argv_passthrough: >
  Debug only, never used by DX_DFIR: -f FILE | -d DIR | --tar (tar on stdin),
  --json DIR --jsonf NAME | --csv DIR --csvf NAME, -q. Exit 0 ok / 1 usage or
  fatal / 2 at least one file failed.
