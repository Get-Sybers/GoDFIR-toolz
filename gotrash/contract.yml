# gotrash/contract.yml — the single source of truth for how DX_DFIR drives this tool.
tool: gotrash
image: get-sybers/gotrash:latest
entrypoint: self-orchestrating
description: >
  XDG Trash parser (static Go on the shared pinfo module): finds every
  *.trashinfo under the input tree (~/.local/share/Trash and per-volume
  .Trash-<uid>) and writes one record per trashed file — original path
  (percent-decoded), deletion time, and the paired files/ twin's size.

env:
  GOTRASH_INPUT_DIR: {required: false, default: /input,  desc: 'evidence tree, recursed read-only; every *.trashinfo file is an item'}
  GOTRASH_OUT_DIR:   {required: false, default: /output, desc: 'output root, one folder per trashinfo file'}
  GOTRASH_KNOWLEDGE_DIR: {required: false, default: /knowledge, desc: 'the Layer-1 knowledge store (gohost/gousers/gonetwork output trees); when the mount is absent, enrichment is simply absent'}
  GOTRASH_WORK_DIR:  {required: false, default: /work,   desc: 'scratch (writable tmpfs); gotrash needs none but honours it'}
  GOTRASH_FORCE:     {required: false, default: "0", type: bool, desc: '1/true/yes/on reruns items that already have valid output'}
  GOTRASH_LOG_LEVEL: {required: false, default: info,    desc: 'error|warn|info|debug, stderr only'}

mounts:
  - {name: input,  path: /input,  mode: ro, env: GOTRASH_INPUT_DIR, required: true}
  - {name: output, path: /output, mode: rw, env: GOTRASH_OUT_DIR,   required: true}
  - {name: knowledge, path: /knowledge, mode: ro, env: GOTRASH_KNOWLEDGE_DIR, required: false}
  - {name: work,   path: /work,   mode: rw, env: GOTRASH_WORK_DIR,  required: false}

network: none
exit_codes: {0: success, 1: nothing_produced, 2: config_error, 3: partial}

summary_schema:
  required: [tool, version, pinfo, status, inputs, processed, skipped, failed, records, outputs, exit, started, duration_s]

outputs:
  layout: "<OUT_DIR>/<item>/gotrash.jsonl; <item> is the file path relative to INPUT_DIR with path separators and whitespace folded to _"

records:
  envelope: [Tool, ToolVersion, RecordType, SourceFilename, SourceModified, EventTime, TimeKind, Origin, Snapshot, Residue, Host]
  trashinfo:
    OriginalPath: 'the deleted file''s original path, percent-decoded per the XDG spec'
    OriginalPathRaw: 'the Path= value verbatim, only when decoding changed it'
    DeletionDateRaw: 'the DeletionDate= value verbatim (EventTime carries the normalised form, TimeKind deleted)'
    TrashedFileExists: 'whether the paired files/ twin is present in the tree'
    TrashedSize: 'the twin''s size in bytes when present and regular'

argv_passthrough: >
  Debug only, never used by DX_DFIR: -f FILE | -d DIR, -q.
  Records stream to stdout. Exit 0 ok / 1 usage or fatal / 2 at least one
  file failed.
