# gore/contract.yml — the single source of truth for how DX_DFIR drives this tool.
tool: gore
image: get-sybers/gore:latest
entrypoint: self-orchestrating
description: >
  Batch-driven Windows registry extractor (static Go on Velociraptor's
  regparser). Batches over the mounted evidence tree, content-detects every
  registry hive by its regf signature, replays sibling .LOG1/.LOG2 transaction
  logs, and for each hive extracts the keys and values the batch definition
  (.reb YAML) names, writing one record per value — the recmd_batch shape
  byakugan consumes — into one output folder per hive.

env:
  GORE_INPUT_DIR: {required: false, default: /input,  desc: 'evidence tree, recursed read-only; every regf hive (not a .LOG* file) is an item; HiveType is inferred from the file name'}
  GORE_OUT_DIR:   {required: false, default: /output, desc: 'output root, one folder per hive'}
  GORE_WORK_DIR:  {required: false, default: /work,   desc: 'scratch (writable tmpfs) for the recovered copy during .LOG replay; unusable = replay falls back to the committed hive'}
  GORE_FORCE:     {required: false, default: "0", type: bool, desc: '1/true/yes/on reruns items that already have valid output'}
  GORE_FORMAT:    {required: false, default: json,    desc: 'record format, json (JSONL) or csv'}
  GORE_BATCH:     {required: false, default: /batch/default.reb, desc: 'batch definition (.reb YAML) to extract; the bundled default is a curated persistence/execution/config key set'}
  GORE_REPLAY:    {required: false, default: "1", type: bool, desc: 'replay dirty-hive .LOG1/.LOG2 transaction logs found beside a hive'}
  GORE_LOG_LEVEL: {required: false, default: info,    desc: 'error|warn|info|debug, stderr only'}

mounts:
  - {name: input,  path: /input,  mode: ro, env: GORE_INPUT_DIR, required: true}
  - {name: output, path: /output, mode: rw, env: GORE_OUT_DIR,   required: true}
  - {name: work,   path: /work,   mode: rw, env: GORE_WORK_DIR,  required: false}

network: none
exit_codes: {0: success, 1: nothing_produced, 2: config_error, 3: partial}

summary_schema:
  required: [tool, version, status, inputs, processed, skipped, failed, records, outputs, exit, started, duration_s]

outputs:
  layout: "<OUT_DIR>/<item>/gore.jsonl (or gore.csv) — one record per extracted value (HivePath, HiveType, Category, Description, Comment, KeyPath, ValueName, ValueType, ValueData, LastWriteTimestamp, Recursive, Deleted); <item> is the hive path relative to INPUT_DIR with path separators and whitespace folded to _"

argv_passthrough: >
  Debug only, never used by DX_DFIR: -f HIVE | -d DIR, --bn FILE, --json DIR
  --jsonf NAME | --csv DIR --csvf NAME, --work-dir DIR, --nl, -q. Exit 0 ok /
  1 usage or fatal / 2 at least one hive failed.
