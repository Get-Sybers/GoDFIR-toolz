# the collection packaging of this repo (README "The image inventory" covers both consumption modes)
namespace: get_sybers
name: godfir_toolz
version: 0.3.0
readme: README.md
authors:
  - Get-Sybers
description: >-
  The hardened get-sybers/* DFIR tool-image BUILD galaxy: the canonical image
  inventory (images.yml), every image's build context and contract.yml, the
  shared hardening playbook (hardening/harden.yml), the conformance tooling
  (conform.sh), and the godfir_build role + build_images playbook that build
  and hardening-verify every image from the manifest — the Windows matrix
  (gowindowlicker), the Linux daemon matrix (godaemonhunter), gomount, and
  the pipeline images (byakugan, plaso, signatures, zeek, anamnesis).
license:
  - Apache-2.0
dependencies:
  # a consumer pinning an exact version (DX_DFIR's requirements.yml) satisfies this range
  community.docker: ">=3.10.3,<5.0.0"
tags:
  - dfir
  - forensics
  - docker
  - security
  - tools
repository: https://github.com/Get-Sybers/GoDFIR-toolz
issues: https://github.com/Get-Sybers/GoDFIR-toolz/issues
build_ignore:
  - .gitignore
  - "*/.conform-build.log"
  # test scenarios stay in the repo, not the artifact (house convention)
  - "roles/*/molecule"
