name: Build & Push Container

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool to build (from images.yml)"
        required: true
        type: choice
        options:
          - signatures
          - byakugan
          - zeek
          - anamnesis
          - plaso
          - gowindowlicker
          - godaemonhunter
          - gomount
      tag:
        description: "Image tag (e.g. v0.2.0, latest)"
        required: true
        type: string
      latest:
        description: "Also tag as latest"
        required: false
        type: boolean
        default: false

# one build per tool at a time; never cancel a push mid-flight
concurrency:
  group: build-${{ inputs.tool }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # the build needs no writable token in the work tree
          persist-credentials: false

      # inputs.tag is free text: validate it as env (never shell-interpolated)
      # against the OCI tag grammar before it reaches the registry
      - name: Validate inputs
        env:
          TOOL: ${{ inputs.tool }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "$TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$' \
            || { echo "invalid image tag '$TAG'" >&2; exit 1; }
          test -f "$TOOL/Dockerfile"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.tool == 'gomount' && 'gomount' || '.' }}
          file: ${{ inputs.tool }}/Dockerfile
          push: true
          tags: |
            ghcr.io/get-sybers/godfir-toolz/${{ inputs.tool }}:${{ inputs.tag }}
            ${{ inputs.latest && format('ghcr.io/get-sybers/godfir-toolz/{0}:latest', inputs.tool) || '' }}
          build-args: |
            GODFIR_REVISION=${{ github.sha }}
            GODFIR_RELEASE=${{ inputs.tag }}
          cache-from: type=gha,scope=${{ inputs.tool }}
          cache-to: type=gha,scope=${{ inputs.tool }},mode=max
