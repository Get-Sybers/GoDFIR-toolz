name: Build & Push Container

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool to build (from images.yml)"
        required: true
        type: choice
        options:
          - signatures
          - byakugan
          - zeek
          - anamnesis
          - plaso
          - gowindowlicker
          - godaemonhunter
          - gomount
      latest:
        description: "Also tag as latest"
        required: false
        type: boolean
        default: false

# one build per tool at a time; never cancel a push mid-flight
concurrency:
  group: build-${{ inputs.tool }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the build needs no writable token in the work tree
          persist-credentials: false

      # the release version IS the Dockerfile's pinned GODFIR_RELEASE: bumped
      # in the PR that changes the image (semver, §31 — breaking: major,
      # feat: minor, fix/chore: patch), reviewed there, and only shipped here.
      # Never a workflow input.
      - name: Resolve release version
        id: ver
        env:
          TOOL: ${{ inputs.tool }}
        run: |
          test -f "$TOOL/Dockerfile"
          VERSION="$(sed -nE 's/^ARG GODFIR_RELEASE=//p' "$TOOL/Dockerfile" | head -n 1)"
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "GODFIR_RELEASE in $TOOL/Dockerfile must be a pinned vX.Y.Z (got '$VERSION')" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $TOOL as :$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # a released tag is immutable. If the image changed on main without its
      # pin being bumped, this is where the release fails — bump the pin in a
      # PR first, never re-ship an existing version.
      - name: Refuse to overwrite an existing release
        env:
          IMAGE: ghcr.io/get-sybers/godfir-toolz/${{ inputs.tool }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists — bump GODFIR_RELEASE in a PR before releasing" >&2
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.tool == 'gomount' && 'gomount' || '.' }}
          file: ${{ inputs.tool }}/Dockerfile
          push: true
          tags: |
            ghcr.io/get-sybers/godfir-toolz/${{ inputs.tool }}:${{ steps.ver.outputs.version }}
            ${{ inputs.latest && format('ghcr.io/get-sybers/godfir-toolz/{0}:latest', inputs.tool) || '' }}
          build-args: |
            GODFIR_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.tool }}
          cache-to: type=gha,scope=${{ inputs.tool }},mode=max
