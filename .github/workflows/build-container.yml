name: Build & Push Container

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool to build (from images.yml)"
        required: true
        type: choice
        options:
          - signatures
          - byakugan
          - zeek
          - anamnesis
          - plaso
          - gowindowlicker
          - godaemonhunter
          - gomount
      latest:
        description: "Also tag as latest"
        required: false
        type: boolean
        default: false

# one build per tool at a time; never cancel a push mid-flight
concurrency:
  group: build-${{ inputs.tool }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # the build needs no writable token in the work tree
          persist-credentials: false

      # the image tag IS the Dockerfile's pinned GODFIR_RELEASE — the
      # get-sybers image release, not the upstream tool's version, and never
      # a manual input that can drift or be fat-fingered
      - name: Resolve release from Dockerfile
        id: ver
        env:
          TOOL: ${{ inputs.tool }}
        run: |
          test -f "$TOOL/Dockerfile"
          VERSION="$(sed -nE 's/^ARG GODFIR_RELEASE=//p' "$TOOL/Dockerfile" | head -n 1)"
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([._-][A-Za-z0-9.]+)?$' \
            || { echo "GODFIR_RELEASE in $TOOL/Dockerfile must be a pinned vX.Y.Z (got '$VERSION')" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $TOOL as :$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.tool == 'gomount' && 'gomount' || '.' }}
          file: ${{ inputs.tool }}/Dockerfile
          push: true
          tags: |
            ghcr.io/get-sybers/godfir-toolz/${{ inputs.tool }}:${{ steps.ver.outputs.version }}
            ${{ inputs.latest && format('ghcr.io/get-sybers/godfir-toolz/{0}:latest', inputs.tool) || '' }}
          build-args: |
            GODFIR_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.tool }}
          cache-to: type=gha,scope=${{ inputs.tool }},mode=max
