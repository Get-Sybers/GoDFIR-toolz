# gojle/contract.yml — the single source of truth for how DX_DFIR drives this tool.
tool: gojle
image: get-sybers/gojle:latest
entrypoint: self-orchestrating
description: >
  Windows jump list (AutomaticDestinations) parser (static Go on
  richardlehane/mscfb). Batches over the mounted evidence tree, finds every
  *.automaticDestinations-ms file, parses its DestList stream and embedded LNK
  streams, and writes one record per jump list — the jlecmd_dest shape
  byakugan consumes — into one output folder per file.

env:
  GOJLE_INPUT_DIR: {required: false, default: /input,  desc: 'evidence tree, recursed read-only; every file whose path contains "automaticdestinations" (case-insensitive) is an item'}
  GOJLE_OUT_DIR:   {required: false, default: /output, desc: 'output root, one folder per jump list'}
  GOJLE_WORK_DIR:  {required: false, default: /work,   desc: 'scratch (writable tmpfs); gojle needs none but honours it'}
  GOJLE_FORCE:     {required: false, default: "0", type: bool, desc: '1/true/yes/on reruns items that already have valid output'}
  GOJLE_FORMAT:    {required: false, default: json,    desc: 'record format; json (JSONL) is the only format'}
  GOJLE_LOG_LEVEL: {required: false, default: info,    desc: 'error|warn|info|debug, stderr only'}

mounts:
  - {name: input,  path: /input,  mode: ro, env: GOJLE_INPUT_DIR, required: true}
  - {name: output, path: /output, mode: rw, env: GOJLE_OUT_DIR,   required: true}
  - {name: work,   path: /work,   mode: rw, env: GOJLE_WORK_DIR,  required: false}

network: none
exit_codes: {0: success, 1: nothing_produced, 2: config_error, 3: partial}

summary_schema:
  required: [tool, version, status, inputs, processed, skipped, failed, records, outputs, exit, started, duration_s]

outputs:
  layout: "<OUT_DIR>/<item>/gojle.jsonl — one record per jump list (AppId{AppId,Description}, SourceFile, DestListEntries[]); <item> is the file path relative to INPUT_DIR with path separators and whitespace folded to _"

argv_passthrough: >
  Debug only, never used by DX_DFIR: -f FILE | -d DIR | --tar (tar on stdin),
  --json DIR --jsonf NAME, -q. Exit 0 ok / 1 usage or fatal / 2 at least one
  file failed.
