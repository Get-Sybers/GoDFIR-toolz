# goprefetch/contract.yml — the single source of truth for how DX_DFIR drives this tool.
tool: goprefetch
image: get-sybers/goprefetch:latest
entrypoint: self-orchestrating
description: >
  Windows Prefetch (.pf) parser (static Go on Velociraptor's go-prefetch, with
  pure-Go LZXpress-Huffman for MAM-compressed files). Batches over the mounted
  evidence tree, finds every *.pf, and writes one record per prefetch file into
  one output folder per file.

env:
  GOPREFETCH_INPUT_DIR: {required: false, default: /input,  desc: 'evidence tree, recursed read-only; every *.pf file (case-insensitive) is an item'}
  GOPREFETCH_OUT_DIR:   {required: false, default: /output, desc: 'output root, one folder per prefetch file'}
  GOPREFETCH_WORK_DIR:  {required: false, default: /work,   desc: 'scratch (writable tmpfs); goprefetch needs none but honours it'}
  GOPREFETCH_FORCE:     {required: false, default: "0", type: bool, desc: '1/true/yes/on reruns items that already have valid output'}
  GOPREFETCH_FORMAT:    {required: false, default: json,    desc: 'record format, json (JSONL) or csv'}
  GOPREFETCH_LOG_LEVEL: {required: false, default: info,    desc: 'error|warn|info|debug, stderr only'}

mounts:
  - {name: input,  path: /input,  mode: ro, env: GOPREFETCH_INPUT_DIR, required: true}
  - {name: output, path: /output, mode: rw, env: GOPREFETCH_OUT_DIR,   required: true}
  - {name: work,   path: /work,   mode: rw, env: GOPREFETCH_WORK_DIR,  required: false}

network: none
exit_codes: {0: success, 1: nothing_produced, 2: config_error, 3: partial}

summary_schema:
  required: [tool, version, status, inputs, processed, skipped, failed, records, outputs, exit, started, duration_s]

outputs:
  layout: "<OUT_DIR>/<item>/goprefetch.jsonl (or goprefetch.csv) — one record per prefetch file (SourceFilename, SourceModified, Executable, Path, Hash, Version, FileSize, RunCount, LastRun, PreviousRuns, FilesAccessed); <item> is the file path relative to INPUT_DIR with path separators and whitespace folded to _"

argv_passthrough: >
  Debug only, never used by DX_DFIR: -f FILE | -d DIR | --tar (tar on stdin),
  --json DIR --jsonf NAME | --csv DIR --csvf NAME, -q. Exit 0 ok / 1 usage or
  fatal / 2 at least one file failed.
