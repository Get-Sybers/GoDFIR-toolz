# goamcache/contract.yml — the single source of truth for how DX_DFIR drives this tool.
tool: goamcache
image: get-sybers/goamcache:latest
entrypoint: self-orchestrating
description: >
  Amcache.hve parser (static Go on Velociraptor's regparser). Batches over the
  mounted evidence tree, content-detects every registry hive that carries
  Root\InventoryApplicationFile, replays sibling .LOG1/.LOG2 transaction logs
  when present, and writes one record per program-execution file entry into
  one output folder per hive.

env:
  GOAMCACHE_INPUT_DIR: {required: false, default: /input,  desc: 'evidence tree, recursed read-only; every regf hive holding Root\InventoryApplicationFile is an item, whatever its name'}
  GOAMCACHE_OUT_DIR:   {required: false, default: /output, desc: 'output root, one folder per hive'}
  GOAMCACHE_WORK_DIR:  {required: false, default: /work,   desc: 'scratch (writable tmpfs) for the recovered copy during .LOG replay; unusable = replay falls back to the committed hive'}
  GOAMCACHE_FORCE:     {required: false, default: "0", type: bool, desc: '1/true/yes/on reruns items that already have valid output'}
  GOAMCACHE_FORMAT:    {required: false, default: json,    desc: 'record format, json (JSONL) or csv'}
  GOAMCACHE_LOG_LEVEL: {required: false, default: info,    desc: 'error|warn|info|debug, stderr only'}

mounts:
  - {name: input,  path: /input,  mode: ro, env: GOAMCACHE_INPUT_DIR, required: true}
  - {name: output, path: /output, mode: rw, env: GOAMCACHE_OUT_DIR,   required: true}
  - {name: work,   path: /work,   mode: rw, env: GOAMCACHE_WORK_DIR,  required: false}

network: none
exit_codes: {0: success, 1: nothing_produced, 2: config_error, 3: partial}

summary_schema:
  required: [tool, version, status, inputs, processed, skipped, failed, records, outputs, exit, started, duration_s]

outputs:
  layout: "<OUT_DIR>/<item>/goamcache.jsonl (or goamcache.csv) — one record per InventoryApplicationFile entry (FileKeyLastWriteTimestamp, ProgramId, SHA1, FullPath, Name, …); <item> is the hive path relative to INPUT_DIR with path separators and whitespace folded to _"

argv_passthrough: >
  Debug only, never used by DX_DFIR: -f FILE | -d DIR, --json DIR --jsonf NAME |
  --csv DIR --csvf NAME, --work-dir DIR, -i, -q. Exit 0 ok / 1 usage, fatal or
  no records / 2 at least one hive failed.
