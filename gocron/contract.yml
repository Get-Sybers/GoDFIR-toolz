# gocron/contract.yml — the single source of truth for how DX_DFIR drives this tool.
tool: gocron
image: get-sybers/gocron:latest
entrypoint: self-orchestrating
description: >
  Linux scheduled-task parser (static Go on the shared pinfo module): system
  and user crontabs, cron.d fragments, run-parts directories, anacrontab and
  at spool jobs become typed records — schedule verbatim, the user column
  only where the format carries one, at-job scripts captured to 64KiB.

env:
  GOCRON_INPUT_DIR: {required: false, default: /input,  desc: 'evidence tree, recursed read-only; every recognised cron/at file is an item'}
  GOCRON_OUT_DIR:   {required: false, default: /output, desc: 'output root, one folder per input file'}
  GOCRON_WORK_DIR:  {required: false, default: /work,   desc: 'scratch (writable tmpfs); gocron needs none but honours it'}
  GOCRON_FORCE:     {required: false, default: "0", type: bool, desc: '1/true/yes/on reruns items that already have valid output'}
  GOCRON_FORMAT:    {required: false, default: json,    desc: 'record format, json (JSONL) or csv'}
  GOCRON_LOG_LEVEL: {required: false, default: info,    desc: 'error|warn|info|debug, stderr only'}

mounts:
  - {name: input,  path: /input,  mode: ro, env: GOCRON_INPUT_DIR, required: true}
  - {name: output, path: /output, mode: rw, env: GOCRON_OUT_DIR,   required: true}
  - {name: work,   path: /work,   mode: rw, env: GOCRON_WORK_DIR,  required: false}

network: none
exit_codes: {0: success, 1: nothing_produced, 2: config_error, 3: partial}

summary_schema:
  required: [tool, version, pinfo, status, inputs, processed, skipped, failed, records, outputs, exit, started, duration_s]

outputs:
  layout: "<OUT_DIR>/<item>/gocron.jsonl (or gocron.csv); <item> is the file path relative to INPUT_DIR with path separators and whitespace folded to _"

records:
  envelope: [Tool, ToolVersion, RecordType, SourceFilename, SourceModified, EventTime, TimeKind, Origin, Snapshot, Residue]
  crontab_entry: {Schedule: 'the five-field or @keyword spec, whitespace-normalised, verbatim otherwise', User: 'the user column (system crontab / cron.d only)', SpoolOwner: 'the spool file name = the owning account, for user spool crontabs', Command: 'the command verbatim', Raw: 'the whole line when the schedule did not parse', Line: 'source line number'}
  crontab_env: {Name: 'environment variable name', Value: 'value verbatim', SpoolOwner: 'as above', Line: 'source line number'}
  anacrontab_entry: {Period: 'period field (days or @keyword)', Delay: 'delay minutes', JobID: 'job identifier', Command: 'command verbatim', Raw: 'the whole line when unparsed', Line: 'source line number'}
  at_job: {JobID: 'the at queue file name', AtUID: 'uid from the # atrun header when present', AtGID: 'gid from the # atrun header when present', Script: 'the job script, captured to 64KiB', Line: 'always 1'}
  cron_runparts: {Name: 'the script file name', Value: 'the run-parts directory (cron.hourly/daily/weekly/monthly)', Line: 'always 1'}

argv_passthrough: >
  Debug only, never used by DX_DFIR: -f FILE | -d DIR, --format json|csv, -q.
  Records stream to stdout. Exit 0 ok / 1 usage or fatal / 2 at least one
  file failed.
