---
# The RUNTIME supply-chain gate (entry point, tasks_from: verify) — the
# ansible successor of the retired python guard's --require: every namespace
# image the caller is about to RUN must be a manifest image and must still
# carry the hardened contract ON THIS HOST (fixed non-root USER +
# com.get-sybers.hardened label). A substituted or un-hardened image stops
# the caller before any evidence is touched. Reuse:
#   - ansible.builtin.include_role:
#       name: get_sybers.godfir_toolz.godfir_build
#       tasks_from: verify
#     vars:
#       godfir_build_verify_images: ["get-sybers/goevtx:latest", ...]
#
# Refs outside the namespace (a documented operator-supplied image) are out
# of scope and pass untouched — but a REGISTRY-QUALIFIED namespace ref
# (docker.io/<ns>/tool, ghcr.io/<ns>/tool, reg:5000/<ns>/tool) is IN scope:
# the registry segment (docker's own heuristic — a first path component with
# a dot or colon, or `localhost`) is normalized away for the membership
# check, so prefixing a registry can never smuggle a ref past the gate. A
# digest-pinned override of a known repo (get-sybers/goevtx@sha256:...) is
# gated exactly like its tag: the digest is stripped for MEMBERSHIP, and the
# ref is inspected AS GIVEN — so a registry-qualified ref must itself exist
# locally and carry the contract.

- name: "godfir-verify | assert the root inventory contract"
  ansible.builtin.include_tasks: inventory.yml

- name: "godfir-verify | scope the gate to the namespace"
  ansible.builtin.set_fact:
    godfir_build_verify_scope: >-
      {{ godfir_build_verify_images
         | select('match', '^((localhost|[^/]*[.:][^/]*)/)?'
                           ~ (godfir_build_namespace | regex_escape) ~ '/')
         | list }}
    # The manifest repos — the ONLY namespace repos allowed to run.
    godfir_build_verify_known: >-
      {{ godfir_build_manifest.images | map(attribute='name')
         | map('regex_replace', '^', godfir_build_namespace ~ '/') | list }}

# Membership on the fully normalized repo: an optional registry segment is
# dropped first, then an @sha256 digest, then a trailing :tag — the tag colon
# only when it comes after the last slash (a colon before that is a registry
# port, already handled by the first strip).
- name: "godfir-verify | refuse namespace refs the manifest does not know"
  vars:
    godfir_build_verify_unknown: >-
      {{ godfir_build_verify_scope
         | map('regex_replace', '^(localhost|[^/]*[.:][^/]*)/', '')
         | map('regex_replace', '@.*$', '')
         | map('regex_replace', ':[^/]+$', '')
         | reject('in', godfir_build_verify_known) | list }}
  ansible.builtin.assert:
    that:
      - godfir_build_verify_unknown | length == 0
    fail_msg: >-
      refusing to run {{ godfir_build_verify_unknown | join(', ') }}: not a
      known {{ godfir_build_namespace }}/* tool image (expected one of:
      {{ godfir_build_verify_known | sort | join(' ') }}).
    quiet: true

- name: "godfir-verify | inspect the gated images"
  community.docker.docker_image_info:
    name: "{{ item }}"
  loop: "{{ godfir_build_verify_scope }}"
  register: godfir_build_verify_info

- name: "godfir-verify | assert each gated image still carries the hardened contract"
  vars:
    godfir_build_verify_img: "{{ item.images | first | default({}) }}"
    godfir_build_verify_labels: "{{ godfir_build_verify_img.Config.Labels | default({}, true) }}"
  ansible.builtin.assert:
    that:
      - item.images | length == 1
      - godfir_build_verify_img.Config.User == (godfir_build_uid | string) ~ ':' ~ (godfir_build_gid | string)
      - godfir_build_verify_labels['com.get-sybers.hardened'] | default('') == 'true'
    fail_msg: >-
      refusing to run {{ item.item }}: it is not the hardened build —
      {{ 'image not present' if item.images | length == 0
         else 'runs as ' ~ (godfir_build_verify_img.Config.User | default('root', true))
              ~ ' / com.get-sybers.hardened='
              ~ (godfir_build_verify_labels['com.get-sybers.hardened'] | default('unset')) }}.
      Rebuild it through the build galaxy (godfir_build; from DX_DFIR:
      dxdfir build-docker).
    quiet: true
  loop: "{{ godfir_build_verify_info.results }}"
  loop_control:
    label: "{{ item.item }}"
