---
# The FULL namespace audit (entry point, tasks_from: audit) — the ansible
# successor of the retired python guard's --audit:
#   - every manifest tool image is PRESENT and still carries the hardened
#     contract on this host;
#   - NO unexpected namespace image exists — the allow-list is the manifest
#     images plus its non_tool_repos; anything else under the namespace is
#     something added that should not be (a supply-chain red flag).
# One aggregated violations report, so a failing audit names everything
# wrong at once. Reuse:
#   - ansible.builtin.include_role:
#       name: get_sybers.godfir_toolz.godfir_build
#       tasks_from: audit

- name: "godfir-audit | assert the root inventory contract"
  ansible.builtin.include_tasks: inventory.yml

- name: "godfir-audit | the expected inventory and the allow-list"
  ansible.builtin.set_fact:
    godfir_build_audit_expected: >-
      {{ godfir_build_manifest.images | map(attribute='name')
         | map('regex_replace', '^', godfir_build_namespace ~ '/')
         | map('regex_replace', '$', ':latest') | list }}
    godfir_build_audit_allowed_repos: >-
      {{ (godfir_build_manifest.images | map(attribute='name')
          | map('regex_replace', '^', godfir_build_namespace ~ '/') | list)
         + (godfir_build_manifest.non_tool_repos | default([])) }}

- name: "godfir-audit | inspect every expected image"
  community.docker.docker_image_info:
    name: "{{ item }}"
  loop: "{{ godfir_build_audit_expected }}"
  register: godfir_build_audit_info

- name: "godfir-audit | list the images on this host"
  community.docker.docker_host_info:
    images: true
  register: godfir_build_audit_host

- name: "godfir-audit | resolve the violations"
  ansible.builtin.set_fact:
    godfir_build_audit_violations: >-
      {%- set v = [] -%}
      {%- set want_user = (godfir_build_uid | string) ~ ':' ~ (godfir_build_gid | string) -%}
      {%- for r in godfir_build_audit_info.results -%}
        {%- if r.images | length == 0 -%}
          {%- set _ = v.append(r.item ~ ': image not present') -%}
        {%- else -%}
          {%- set cfg = r.images[0].Config -%}
          {%- if (cfg.User | default('', true)) != want_user -%}
            {%- set _ = v.append(r.item ~ ': runs as ' ~ (cfg.User | default('root', true)) ~ ', not uid ' ~ want_user) -%}
          {%- endif -%}
          {%- if ((cfg.Labels or {})['com.get-sybers.hardened'] | default('')) != 'true' -%}
            {%- set _ = v.append(r.item ~ ': missing com.get-sybers.hardened=true label') -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {#- The namespace sweep covers REGISTRY-QUALIFIED tags too: an optional
          registry segment (a first path component with a dot or colon, or
          localhost) is normalized away before comparing, so
          ghcr.io/<ns>/evil can not hide from the audit behind its prefix.
          The violation names the tag AS TAGGED. -#}
      {%- set ns_tags = godfir_build_audit_host.images | default([])
            | map(attribute='RepoTags') | select('sequence') | flatten
            | select('string')
            | select('match', '^((localhost|[^/]*[.:][^/]*)/)?'
                              ~ (godfir_build_namespace | regex_escape) ~ '/')
            | reject('search', '<none>') | list -%}
      {%- for tag in ns_tags -%}
        {%- set bare = tag | regex_replace('^(localhost|[^/]*[.:][^/]*)/', '') -%}
        {%- set repo = bare | regex_replace('@.*$', '') | regex_replace(':[^/]+$', '') -%}
        {%- if bare not in godfir_build_audit_expected and repo not in godfir_build_audit_allowed_repos -%}
          {%- set _ = v.append(tag ~ ': unexpected ' ~ godfir_build_namespace
                ~ '/* image — not a known manifest image (something was added'
                ~ ' to the namespace that should not be)') -%}
        {%- endif -%}
      {%- endfor -%}
      {{ v }}

- name: "godfir-audit | the namespace audit verdict"
  ansible.builtin.assert:
    that:
      - godfir_build_audit_violations | length == 0
    fail_msg: >-
      the {{ godfir_build_namespace }}/* inventory audit failed:
      {{ godfir_build_audit_violations | join('; ') }}
    success_msg: >-
      audited {{ godfir_build_audit_expected | length }} expected images —
      all present, all hardened, no unexpected
      {{ godfir_build_namespace }}/* images on the host.
