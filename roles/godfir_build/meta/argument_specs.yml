---
argument_specs:
  main:
    short_description: Build get-sybers/* images from images.yml and verify the hardening contract on each
    description:
      - Builds the requested manifest images (or all of them) with BuildKit,
        stamps each with the source revision (com.get-sybers.src) so a source
        bump replaces stale images without force, and verifies every result -
        the static contract (fixed non-root USER, com.get-sybers.hardened
        label), a shell-free docker-export filesystem scan for the removed
        surface, and the image's own /etc/dfir-hardened posture declaration
        (shell=false / python=false are held to the actual filesystem).
      - The role groups; the caller decides. build-all.sh launches the
        collection playbook, DX_DFIR's dxdfir_images delegates here at its
        submodule pin, and a galaxy install exposes the same role as
        get_sybers.godfir_toolz.godfir_build.
    options:
      godfir_build_set:
        type: list
        elements: str
        default: []
        description: "Image names or aliases from images.yml, case-insensitive; empty builds every manifest image in order."
      godfir_build_force:
        type: bool
        default: false
        description: "Rebuild even when an image's source stamp is current (docker build cache still applies)."
      godfir_build_uid:
        type: str
        default: "2000"
        description: "Run-as uid baked into every image's USER (DFIR_UID build arg) and asserted on the result."
      godfir_build_gid:
        type: str
        default: "the uid"
        description: "Run-as gid; follows godfir_build_uid unless set."
      godfir_build_src_sha:
        type: str
        default: ""
        description:
          - "The source identity to stamp (com.get-sybers.src). Empty resolves
            git HEAD of the checkout, else the installed collection's version;
            a consumer that knows its pin may pass it."
      godfir_build_release:
        type: str
        default: ""
        description: "The release tag passed as the GODFIR_RELEASE build arg. Empty resolves git describe, else the collection version."
      godfir_build_root:
        type: str
        default: ""
        description:
          - "The tree to build from: where images.yml, the build contexts and
            hardening/harden.yml live. Empty means THIS ROLE'S OWN
            repo/collection root (two directories above the role), which
            resolves in a source checkout and an installed collection alike;
            a consumer that pins the tree elsewhere passes that root."
  verify:
    short_description: The runtime supply-chain gate over the manifest
    description:
      - Refuse to run anything but the manifest's hardened images - every
        namespace ref in godfir_build_verify_images must be a manifest image
        (membership on the digest/tag-normalized repo) and must still carry
        the hardened contract on this host (fixed non-root USER +
        com.get-sybers.hardened label). Refs outside the namespace pass
        untouched. The ansible successor of the retired python guard's
        --require.
    options:
      godfir_build_verify_images:
        type: list
        elements: str
        default: []
        description: "The image refs the caller is about to run."
      godfir_build_root:
        type: str
        default: ""
        description: "The tree carrying images.yml; empty = this role's own repo/collection root."
      godfir_build_uid:
        type: str
        default: "2000"
        description: "The run-as uid the contract asserts (USER uid:gid)."
      godfir_build_gid:
        type: str
        default: "the uid"
        description: "The run-as gid; follows godfir_build_uid unless set."
  audit:
    short_description: The full namespace inventory audit
    description:
      - Every manifest tool image must be present and still hardened on this
        host, and no unexpected namespace image may exist (allow-list = the
        manifest images + non_tool_repos). One aggregated violations report.
        The ansible successor of the retired python guard's --audit.
    options:
      godfir_build_root:
        type: str
        default: ""
        description: "The tree carrying images.yml; empty = this role's own repo/collection root."
      godfir_build_uid:
        type: str
        default: "2000"
        description: "The run-as uid the contract asserts (USER uid:gid)."
      godfir_build_gid:
        type: str
        default: "the uid"
        description: "The run-as gid; follows godfir_build_uid unless set."
