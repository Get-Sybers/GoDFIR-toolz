---
- name: Prepare
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "prepare | remove leftover fixture images"
      community.docker.docker_image:
        name: "{{ item }}"
        state: absent
        force_absent: true
      loop:
        - get-sybers/standin:latest
        - get-sybers/rootctx:latest
        - get-sybers/badshell:latest
        - get-sybers/nodecl:latest
        - get-sybers/evil:latest
        - ghcr.io/get-sybers/evil:latest
        - get-sybers/friendly:latest
