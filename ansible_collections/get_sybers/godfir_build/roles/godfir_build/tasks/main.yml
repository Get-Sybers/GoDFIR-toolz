---
- name: "godfir-build | assert the root inventory contract"
  ansible.builtin.include_tasks: inventory.yml

- name: "godfir-build | docker daemon reachable"
  ansible.builtin.command: docker version
  register: godfir_build_docker
  changed_when: false

- name: "godfir-build | stat the canonical hardening playbook"
  ansible.builtin.stat:
    path: "{{ godfir_build_tree }}/hardening/harden.yml"
  register: godfir_build_harden_stat

- name: "godfir-build | the build tree is complete"
  ansible.builtin.assert:
    that:
      - godfir_build_harden_stat.stat.exists
    fail_msg: >-
      {{ godfir_build_tree }}/hardening/harden.yml is missing — the build tree
      is incomplete (a partial checkout, or a consumer whose GoDFIR-toolz
      submodule is not initialised: git submodule update --init --recursive).
    quiet: true

- name: "godfir-build | resolve the checkout revision"
  # noqa: command-instead-of-module — read-only rev-parse; the git module clones.
  ansible.builtin.command:
    argv: [git, -C, "{{ godfir_build_tree }}", rev-parse, HEAD]
  register: godfir_build_git_head
  changed_when: false
  failed_when: false
  when: godfir_build_src_sha | length == 0

- name: "godfir-build | resolve the release tag"
  # noqa: command-instead-of-module — read-only describe; the git module clones.
  ansible.builtin.command:
    argv: [git, -C, "{{ godfir_build_tree }}", describe, --tags, --always]
  register: godfir_build_git_describe
  changed_when: false
  failed_when: false
  when: godfir_build_release | length == 0

- name: "godfir-build | keep the stamps as facts"
  vars:
    _collection_version: >-
      {{ ((lookup('file', godfir_build_tree ~ '/MANIFEST.json', errors='ignore')
           | default('', true) | from_json) or {}).collection_info.version | default('') }}
  ansible.builtin.set_fact:
    godfir_build_src: >-
      {{ godfir_build_src_sha
         if godfir_build_src_sha | length > 0
         else (((godfir_build_git_head.stdout | default('')) | trim)
               or _collection_version or 'unknown') }}
    godfir_build_rel: >-
      {{ godfir_build_release
         if godfir_build_release | length > 0
         else (((godfir_build_git_describe.stdout | default('')) | trim)
               or _collection_version or 'dev') }}

- name: "godfir-build | resolve the requested set against the manifest"
  ansible.builtin.include_tasks: resolve.yml

- name: "godfir-build | build + verify each image"
  ansible.builtin.include_tasks: build_one.yml
  loop: "{{ godfir_build_resolved }}"
  loop_control:
    loop_var: godfir_build_name
