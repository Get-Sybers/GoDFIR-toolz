---
# The full namespace audit is one home: get_sybers.godfir_run.godfir_images.
# godfir_build delegates to it against this repo's manifest.
- name: "godfir-audit | assert the root inventory contract"
  ansible.builtin.include_tasks: inventory.yml

- name: "godfir-audit | audit the namespace through godfir_images"
  ansible.builtin.include_role:
    name: get_sybers.godfir_run.godfir_images
    tasks_from: audit
  vars:
    godfir_images_namespace: "{{ godfir_build_namespace }}"
    godfir_images_uid: "{{ godfir_build_uid }}"
    godfir_images_gid: "{{ godfir_build_gid }}"
    godfir_images_manifest_path: "{{ godfir_build_tree }}/images.yml"
