---
# memory output gate, included at the end of godfir_run's process block: some
# plugin produced output, UNLESS there were no images (images == 0). Per-plugin
# failures are NORMAL (Windows plugins error without symbols), so this gates on
# output, not failed==0 (godfir_run_require_no_failures is false for this lane).
# A trusted literal assert — godfir_run_summaries (one per run; this lane has
# one) + godfir_run_verify are in scope from the shared process step. The
# anamnesis summary counts its inputs as `images`.
- name: "godfir-anamnesis-process | assert output was produced for the images present"
  ansible.builtin.assert:
    that:
      - godfir_run_verify.matched | int > 0 or (godfir_run_summaries | first).images | int == 0
    fail_msg: >-
      memory produced no JSONL at all though memory images were present (symbols
      unavailable for every plugin?).
    quiet: true
