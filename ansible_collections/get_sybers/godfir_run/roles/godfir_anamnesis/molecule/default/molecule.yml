---
# offline: godfir_run_build_only stops after argv construction. The lane calls
# godfir_run by FQCN, so the collection is on ANSIBLE_COLLECTIONS_PATH.
prerun: false
dependency:
  name: galaxy
  enabled: false
driver:
  name: default
platforms:
  - name: localhost
provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../../../../..
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  inventory:
    host_vars:
      localhost:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        godfir_run_build_only: true
  playbooks:
    converge: converge.yml
verifier:
  name: ansible
