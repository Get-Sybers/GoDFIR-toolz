---
godfir_run_name: run

# run-spec schema: README.md "The run spec"
godfir_run_runs: []

godfir_run_confinement:
  - "--cap-drop"
  - "ALL"
  - "--security-opt"
  - "no-new-privileges"
  - "--pids-limit"
  - "512"
  - "--read-only"
godfir_run_tmpfs_opts: "rw,nosuid,nodev,exec,size=1g"
godfir_run_exit_ok: [0, 1, 3]

godfir_run_verify_dir: ""
godfir_run_verify_glob: ""
godfir_run_gate_extra: ""

godfir_run_require_no_failures: true

# build_only: construct the argv and stop — no daemon, no pull, no container run.
# A dry validate of a lane's run spec (a lane's molecule uses it offline).
godfir_run_build_only: false
