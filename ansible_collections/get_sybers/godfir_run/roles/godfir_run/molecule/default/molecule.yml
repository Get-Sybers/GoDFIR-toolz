---
# offline by design: build-step validation only, no daemon, no pull
prerun: false
dependency:
  name: galaxy
  enabled: false
driver:
  name: default            # delegated — build-step validation only, no containers
platforms:
  - name: localhost
provisioner:
  name: ansible
  env:
    # the collection's roles (godfir_run + godfir_images)
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  inventory:
    host_vars:
      localhost:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
  playbooks:
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
