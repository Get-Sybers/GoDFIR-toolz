---
# godaemonhunter output gate, included at the end of godfir_run's process block
# instead of the default one: some parser produced output, UNLESS no parser
# found an artefact to parse (a Windows image is NORMAL: the whole matrix exits
# 1 by design and lights up when Linux content arrives). Per-item failures are
# tolerated (godfir_run_require_no_failures is false). A trusted literal assert —
# godfir_run_summaries + godfir_run_verify are in scope from the shared process step.
- name: "godfir-godaemonhunter-process | assert output was produced for the artefacts present"
  ansible.builtin.assert:
    that:
      - >-
        godfir_run_verify.matched | int > 0
        or (godfir_run_summaries | map(attribute='inputs') | map('int') | sum) == 0
    fail_msg: >-
      godaemonhunter produced no output at all though artefacts were present
      (every parser container failed?).
    quiet: true
