---
argument_specs:
  main:
    short_description: "Pull a set of get-sybers/* tool images from the registry."
    description:
      - >-
        Pull the images named in godfir_images_set from the registry and tag
        each to its local get-sybers/<tool>:latest name (a thin wrapper over
        ensure_present). The lanes pull what they run via preflight, so this is
        a convenience for provisioning a host up front.
    options:
      godfir_images_set:
        type: list
        elements: str
        required: false
        default: []
        description: "Local image refs to pull, e.g. get-sybers/zeek:latest."
      godfir_images_registry:
        type: str
        required: false
        default: ghcr.io/get-sybers/godfir-toolz
        description: "The registry namespace the published images are pulled from."
      godfir_images_tag:
        type: str
        required: false
        default: ""
        description: >-
          Global override of the pull tag. Empty (the default) pulls each
          image's own `release:` from the manifest — never 'latest'.
        description: "The release tag to pull for every image."
      godfir_images_force:
        type: bool
        required: false
        default: false
        description: "Re-pull images that are already present."
  ensure_present:
    short_description: "Ensure a set of tool images is present (pull the missing ones)."
    description:
      - >-
        Reusable, idempotent gate (tasks/ensure_present.yml): read the local
        image facts and pull any required ref that is not present, tagging each
        pulled registry image to its local get-sybers/<tool>:latest name — a
        missing image self-heals in place, an already-present one is a no-op.
        Presence only; the posture gate (verify) enforces the hardened contract.
    options:
      godfir_images_required:
        type: list
        elements: str
        required: false
        default: []
        description: "Local image refs the caller needs present, e.g. get-sybers/gowindowlicker:latest."
      godfir_images_force:
        type: bool
        required: false
        default: false
        description: "Re-pull even when the image is already present."
  verify:
    short_description: "The runtime supply-chain gate (membership + posture)."
    description:
      - >-
        Every namespace ref in godfir_images_verify_images must be a KNOWN
        manifest image (membership) and still carry the hardened contract on this
        host — the non-root USER (uid:gid) and the com.get-sybers.hardened label
        (posture). Refs outside get-sybers/* pass untouched. Lane preflights call
        this before any container runs.
    options:
      godfir_images_verify_images:
        type: list
        elements: str
        required: false
        default: []
        description: "The image refs the caller is about to run."
      godfir_images_manifest_path:
        type: str
        required: false
        description: "The manifest (images.yml) whose image names define membership (default: the copy shipped with the role)."
      godfir_images_uid:
        type: int
        required: false
        default: 2000
        description: "The non-root uid every hardened image must run as."
      godfir_images_gid:
        type: int
        required: false
        description: "The gid every hardened image must run as (defaults to the uid)."
  audit:
    short_description: "The full namespace inventory audit."
    description:
      - >-
        Every image in the manifest must be present and hardened on this host,
        and no unexpected get-sybers/* image may exist (the allow-list is the
        manifest images plus its non_tool_repos). One aggregated verdict names
        every violation at once.
    options:
      godfir_images_manifest_path:
        type: str
        required: false
        description: "The manifest (images.yml) defining the expected inventory and allow-list (default: the copy shipped with the role)."
      godfir_images_uid:
        type: int
        required: false
        default: 2000
        description: "The non-root uid every hardened image must run as."
      godfir_images_gid:
        type: int
        required: false
        description: "The gid every hardened image must run as (defaults to the uid)."
