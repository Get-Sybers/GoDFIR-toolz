---
# Idempotent, self-healing pull gate: read the local image facts, pull the
# required refs that are missing — OR present but digest-stale — (or all, under
# force) at the image's release tag, tag each pulled registry image to the local
# get-sybers/<tool>:latest name the contracts use, then VERIFY the pulled content
# against the digest the manifest records for it. The pull always resolves
# <registry>/<tool>:<release> (or the godfir_images_tag override), so the local
# image keeps its readable version tag; the recorded digest is a post-pull
# content check — the pulled image's RepoDigests must carry
# <registry>/<tool>@<digest> — never the pull ref. A present image is held to the
# same digest: when its RepoDigests does not carry the recorded digest it is
# re-pulled by tag and re-verified, so a stale local :latest no longer slips the
# gate (#120). An image with no recorded digest is pulled by tag and not
# verified; godfir_images_tag (a deliberate off-manifest wave) bypasses the check.
# the pull decision (missing + digest-stale), side-effect free — tasks/resolve.yml
- name: "godfir-images | resolve the pull set"
  ansible.builtin.include_tasks: resolve.yml

- name: "godfir-images | every image to pull resolves a release, and a recorded digest is well-formed"
  vars:
    _tool: >-
      {{ item | regex_replace('^([^/]+/)?' ~ (godfir_images_namespace | regex_escape) ~ '/', '')
              | regex_replace('[@:].*$', '') }}
    _digest: "{{ godfir_images_digests[_tool] | default('') }}"
  ansible.builtin.assert:
    that:
      - (godfir_images_tag | length > 0) or (godfir_images_releases[_tool] | default('') | length > 0)
      - (_digest | length == 0) or (_digest is match('^sha256:[0-9a-f]{64}$'))
    fail_msg: >-
      '{{ _tool }}' does not resolve a pull: the manifest
      ({{ godfir_images_manifest_path }}) must carry a `release:` for it (or
      godfir_images_tag be set) and, when it records a `digest:`, that digest
      must be sha256:<64 hex> (got '{{ _digest }}').
  loop: "{{ godfir_images_to_pull | default([]) }}"
  loop_control:
    label: "{{ item }}"

- name: "godfir-images | pull each missing-or-stale image from the registry by its release tag"
  vars:
    _tool: >-
      {{ item | regex_replace('^([^/]+/)?' ~ (godfir_images_namespace | regex_escape) ~ '/', '')
              | regex_replace('[@:].*$', '') }}
    _tag: >-
      {{ godfir_images_tag if (godfir_images_tag | length > 0)
         else godfir_images_releases[_tool] | default('') }}
    _registry_ref: "{{ godfir_images_registry }}/{{ _tool }}:{{ _tag }}"
  community.docker.docker_image_pull:
    name: "{{ _registry_ref }}"
    # a digest-stale present image must fetch fresh bytes, not keep what is local
    pull: "{{ 'always' if (godfir_images_force | bool or item in godfir_images_stale) else 'not_present' }}"
  loop: "{{ godfir_images_to_pull | default([]) }}"
  loop_control:
    label: "{{ item }} <- {{ _registry_ref }}"
  register: godfir_images_pull
  retries: 3
  delay: 5
  until: godfir_images_pull is not failed

- name: "godfir-images | tag each pulled registry image to its local ref"
  vars:
    _tool: >-
      {{ item | regex_replace('^([^/]+/)?' ~ (godfir_images_namespace | regex_escape) ~ '/', '')
              | regex_replace('[@:].*$', '') }}
    _tag: >-
      {{ godfir_images_tag if (godfir_images_tag | length > 0)
         else godfir_images_releases[_tool] | default('') }}
    _registry_ref: "{{ godfir_images_registry }}/{{ _tool }}:{{ _tag }}"
  community.docker.docker_image_tag:
    name: "{{ _registry_ref }}"
    repository: ["{{ item }}"]
  loop: "{{ godfir_images_to_pull | default([]) }}"
  loop_control:
    label: "{{ _registry_ref }} -> {{ item }}"

# Verify the content we just pulled is EXACTLY what the manifest recorded: the
# freshly pulled image's registry digest (RepoDigests) must carry the manifest
# digest. Pulling by tag fetches "whatever the tag points at"; this turns it
# into "the exact bytes the release build pushed" (a moved tag is refused).
# Scoped to the freshly pulled set, skipped under the godfir_images_tag
# override and for any image the manifest records no digest for.
- name: "godfir-images | read the freshly pulled images' content digests"
  community.docker.docker_image_info:
    name: "{{ item }}"
  loop: "{{ godfir_images_to_pull | default([]) }}"
  loop_control:
    label: "{{ item }}"
  register: godfir_images_pulled_info
  when: godfir_images_tag | length == 0

- name: "godfir-images | assert each pulled image matches the manifest digest"
  vars:
    _tool: >-
      {{ item.item | regex_replace('^([^/]+/)?' ~ (godfir_images_namespace | regex_escape) ~ '/', '')
                   | regex_replace('[@:].*$', '') }}
    _digest: "{{ godfir_images_digests[_tool] | default('') }}"
    _repo_digests: "{{ (item.images | first | default({})).RepoDigests | default([]) }}"
    _expected: "{{ godfir_images_registry }}/{{ _tool }}@{{ _digest }}"
  ansible.builtin.assert:
    that:
      - (_digest | length == 0) or (_expected in _repo_digests)
    fail_msg: >-
      '{{ _tool }}' pulled from {{ godfir_images_registry }} does not match the
      manifest digest: expected {{ _expected }} among the pulled image's
      RepoDigests ({{ _repo_digests | join(', ') if (_repo_digests | length > 0) else 'none' }}).
      The release tag may have been moved — refusing the content.
    quiet: true
  loop: "{{ godfir_images_pulled_info.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  # mirror the info task's guard: under the godfir_images_tag override the info
  # task is skipped, which still registers one skipped result per item (no
  # `images` key) — without this the assert would iterate them and fail,
  # turning the documented bypass into a hard failure.
  when: godfir_images_tag | length == 0
