---
# one knob renames the whole image family
godfir_images_namespace: get-sybers

# where the published images live. The lanes and contracts reference the
# local name get-sybers/<tool>:latest; ensure_present pulls
# <registry>/<tool>@<digest> (or :<release>, below) and tags it to that local
# name, so nothing downstream has to carry a registry-qualified ref.
godfir_images_registry: ghcr.io/get-sybers/godfir-toolz
# what to pull: each image's `release:` in the manifest is the ONE source of
# its tag (kept in step with its Dockerfile's GODFIR_RELEASE — releases move
# per image, never as one floating tag, standards §31), and its `digest:` —
# the content digest the Build & Push workflow pushed for that release,
# recorded in the manifest once the image is built — pins the pull to that
# exact content (<registry>/<tool>@<digest>) when present; an image without a
# recorded digest is pulled by its release tag. Setting godfir_images_tag
# non-empty overrides every image to that one tag (fixtures, pinning a whole
# older wave) and bypasses the digests; it is never 'latest'.
godfir_images_tag: ""
godfir_images_releases: >-
  {{ dict(godfir_images_manifest.images | default([])
          | selectattr('release', 'defined') | map(attribute='name')
          | zip(godfir_images_manifest.images | default([])
                | selectattr('release', 'defined') | map(attribute='release'))) }}
godfir_images_digests: >-
  {{ dict(godfir_images_manifest.images | default([])
          | selectattr('digest', 'defined') | map(attribute='name')
          | zip(godfir_images_manifest.images | default([])
                | selectattr('digest', 'defined') | map(attribute='digest'))) }}

# the single run-as knob: the hardened images' non-root uid:gid (verify asserts it)
godfir_images_uid: 2000
# gid follows the uid unless set, so a lone uid override still yields a matched USER
godfir_images_gid: "{{ godfir_images_uid }}"

# the image manifest (images.yml) shipped with the role: verify's membership
# gate and audit read it. Override the path to drive them off another manifest
# (e.g. a molecule fixture, or the repo-root manifest in-repo).
godfir_images_manifest_path: "{{ role_path }}/files/images.yml"
godfir_images_manifest: >-
  {{ (lookup('file', godfir_images_manifest_path, errors='ignore') | default('', true) | from_yaml) or {} }}
# the known namespace image repos (namespace/<name>) and the allow-list extras
godfir_images_known: >-
  {{ godfir_images_manifest.images | default([]) | map(attribute='name')
     | map('regex_replace', '^', godfir_images_namespace ~ '/') | list }}
godfir_images_non_tool_repos: "{{ godfir_images_manifest.non_tool_repos | default([]) }}"

# ensure_present: local refs the caller needs present; missing ones are pulled
godfir_images_required: []

# verify: refs about to run — the posture + membership gate scopes these to the namespace
godfir_images_verify_images: []

# main: local refs to pull up front (a convenience; the lanes pull what they run)
godfir_images_set: []

# re-pull even when already present
godfir_images_force: false
