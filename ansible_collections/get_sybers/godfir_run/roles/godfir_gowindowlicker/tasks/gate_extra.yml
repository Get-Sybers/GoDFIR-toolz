---
# gowindowlicker output gate, included at the end of godfir_run's process block
# instead of the default one: some parser produced output, UNLESS no parser
# found an artefact to parse (a host with none of the set is NORMAL, not a
# failure). Per-item failures are tolerated (godfir_run_require_no_failures is
# false). A trusted literal assert — godfir_run_summaries + godfir_run_verify
# are in scope from the shared process step.
- name: "godfir-gowindowlicker-process | assert output was produced for the artefacts present"
  ansible.builtin.assert:
    that:
      - >-
        godfir_run_verify.matched | int > 0
        or (godfir_run_summaries | map(attribute='inputs') | map('int') | sum) == 0
    fail_msg: >-
      gowindowlicker produced no output at all though artefacts were present
      (every parser container failed?).
    quiet: true
