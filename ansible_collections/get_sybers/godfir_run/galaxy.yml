namespace: get_sybers
name: godfir_run
version: 0.2.2
readme: README.md
authors:
  - Get-Sybers
description: >-
  Consumer collection for the get-sybers DFIR tool images: pull the published
  images from the registry and run each tool under its confinement contract.
  godfir_run is the generic contract-driven confined docker-run engine,
  godfir_images the image lifecycle (pull/verify/audit), and one lane role per
  image drives its run spec. This is the collection downstreams pin — they
  consume the images, they do not build them.
license:
  - Apache-2.0
dependencies:
  community.docker: ">=3.10.3,<5.0.0"
tags: [dfir, forensics, docker, security, run]
repository: https://github.com/Get-Sybers/GoDFIR-toolz
issues: https://github.com/Get-Sybers/GoDFIR-toolz/-/issues
build_ignore:
  - .gitignore
  - "roles/*/molecule"
