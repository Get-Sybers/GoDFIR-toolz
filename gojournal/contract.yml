# gojournal/contract.yml — the single source of truth for how DX_DFIR drives this tool.
tool: gojournal
image: get-sybers/gojournal:latest
entrypoint: self-orchestrating
description: >
  systemd journal parser (static Go on the shared pinfo module): every
  binary *.journal file under the input tree — archived and dirty
  (*.journal~) alike — streamed entry by entry, XZ/LZ4/ZSTD data payloads
  decoded, compact-mode files (systemd 252+) supported. One record per
  entry; the journal's own fields verbatim.

env:
  GOJOURNAL_INPUT_DIR: {required: false, default: /input,  desc: 'evidence tree, recursed read-only; every *.journal / *.journal~ file is an item'}
  GOJOURNAL_OUT_DIR:   {required: false, default: /output, desc: 'output root, one folder per journal file'}
  GOJOURNAL_WORK_DIR:  {required: false, default: /work,   desc: 'scratch (writable tmpfs); gojournal needs none but honours it'}
  GOJOURNAL_FORCE:     {required: false, default: "0", type: bool, desc: '1/true/yes/on reruns items that already have valid output'}
  GOJOURNAL_LOG_LEVEL: {required: false, default: info,    desc: 'error|warn|info|debug, stderr only'}

mounts:
  - {name: input,  path: /input,  mode: ro, env: GOJOURNAL_INPUT_DIR, required: true}
  - {name: output, path: /output, mode: rw, env: GOJOURNAL_OUT_DIR,   required: true}
  - {name: work,   path: /work,   mode: rw, env: GOJOURNAL_WORK_DIR,  required: false}

network: none
exit_codes: {0: success, 1: nothing_produced, 2: config_error, 3: partial}

summary_schema:
  required: [tool, version, pinfo, status, inputs, processed, skipped, failed, records, outputs, exit, started, duration_s]

outputs:
  layout: "<OUT_DIR>/<item>/gojournal.jsonl; <item> is the file path relative to INPUT_DIR with path separators and whitespace folded to _"

records:
  envelope: [Tool, ToolVersion, RecordType, SourceFilename, SourceModified, EventTime, TimeKind, Origin, Snapshot, Residue]
  journal_entry:
    MachineID: 'the file header machine id (hex) — identity, with BootID and Seqnum'
    BootID: 'the entry boot id (hex)'
    Seqnum: 'the entry sequence number'
    MonotonicUS: 'monotonic clock microseconds'
    Message: 'MESSAGE verbatim (EventTime carries __REALTIME microseconds)'
    Priority: 'PRIORITY verbatim (0-7)'
    Facility: 'SYSLOG_FACILITY verbatim'
    Identifier: 'SYSLOG_IDENTIFIER'
    PID: '_PID, numeric string verbatim'
    UID: '_UID verbatim (resolution is enrichment, byakugan''s)'
    GID: '_GID verbatim'
    Comm: '_COMM'
    Exe: '_EXE'
    Cmdline: '_CMDLINE'
    SystemdUnit: '_SYSTEMD_UNIT'
    UserUnit: '_SYSTEMD_USER_UNIT'
    Hostname: '_HOSTNAME'
    Transport: '_TRANSPORT'
    AuditSession: '_AUDIT_SESSION'
    Fields: 'every other field verbatim (capped at 128; non-UTF-8 values hex-prefixed)'
    Truncated: 'true when payloads were capped or a dirty entry lost items'

argv_passthrough: >
  Debug only, never used by DX_DFIR: -f FILE | -d DIR, -q.
  Records stream to stdout. Exit 0 ok / 1 usage or fatal / 2 at least one
  file failed.
